name: Keepalive

# Scheduled workflows are auto-disabled by GitHub after 60 days with no commits
# to the repo. This pushes a small commit twice a month so the inactivity timer
# never expires, keeping the Attendance Reminder cron alive (and itself too).

on:
  schedule:
    - cron: "0 8 1,15 * *"   # 1st and 15th of each month, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Push keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git add .github/keepalive
          git commit -m "chore: keepalive [skip ci]"
          git push
